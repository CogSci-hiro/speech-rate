preprocessing:
  channels:
    eeg_names: []
    eeg_name_patterns: []
    emg_names: ["EMG1", "EMG2"]
    emg_patterns: ["\\bEMG\\b", "\\bEXG\\b"]
    drop_names: []
  montage:
    name: "standard_1020"
    on_missing: "ignore"
    match_case: false
  events:
    stim_channel: null
    shortest_event: 1
    consecutive: true
  downsample:
    sfreq_hz: 200.0
  filter:
    l_freq_hz: 0.1
    h_freq_hz: 30.0
  bad_channels:
    path_pattern: null
  ica:
    path_pattern: "{subject_id}_task-{task}-ica.fif"
  interpolation:
    method: "mne_interpolate_bads"
  rereference:
    method: "average"
  output:
    eeg_filename: "eeg_preprocessed_raw.fif"
    emg_filename: "emg.npz"
    events_filename: "events.tsv"
    summary_filename: "preprocessing_summary.json"
  pipeline_order:
    - "separate_drop_channels"
    - "downsample"
    - "bandpass"
    - "apply_precomputed_ica"
    - "interpolate_bad_channels"
    - "rereference"
