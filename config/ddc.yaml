# Phase 1 modular config duplicate from config/config.yaml
ddc:

  feature_sets:
    behaviour: ["self_rate", "other_rate", "abs_diff", "self_rate_sq", "other_rate_sq", "abs_diff_sq"]
    eeg: ["aperiodic_offset", "aperiodic_exponent",
          "theta_pw", "alpha_pw", "beta_pw"]

  distance:
    metric: "euclidean"
    standardize: "group_z"      # none | group_z | dyad_z
    dyad_mean_center: true
