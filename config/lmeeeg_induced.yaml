lmeeeg_induced:
  enabled: true
  backend: "lmeeeg"
  random_effects:
    group: "subject_id"
    structure: "random_intercept"

  targets:
    - "theta"
    - "beta"
    - "alpha"

  extraction:
    method: "hilbert"
    bands:
      theta:
        fmin: 4.0
        fmax: 7.0
      beta:
        fmin: 13.0
        fmax: 30.0
      alpha:
        fmin: 8.0
        fmax: 12.0
    morlet:
      n_freqs: 6
      n_cycles: 5.0
      use_fft: true
      decim: 1
      zero_mean: true
    hilbert:
      l_trans_bandwidth: "auto"
      h_trans_bandwidth: "auto"
      phase: "zero"
      fir_design: "firwin"
      envelope: true

  models:

    other_rate_effect:
      formula: "~ other_rate + latency + duration_s + time_within_run + run"
      eligibility:
        not_null:
          - "other_rate"
        min_values:
          other_n_syllables: 3
          other_ipu_duration: 0.10
      test_predictors:
        - "other_rate"
      standardize:
        - "other_rate"
        - "latency"
        - "duration_s"
        - "time_within_run"
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"

    self_rate_effect:
      formula: "~ self_rate + latency + duration_s + time_within_run + run"
      eligibility:
        not_null:
          - "self_rate"
        min_values:
          self_n_syllables: 3
          self_ipu_duration: 0.10
      test_predictors:
        - "self_rate"
      standardize:
        - "self_rate"
        - "latency"
        - "duration_s"
        - "time_within_run"
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"

    residual_signed_effect:
      formula: "~ residual_signed + latency + duration_s + time_within_run + run"
      eligibility:
        not_null:
          - "residual_signed"
          - "self_rate"
          - "other_rate"
        min_values:
          self_n_syllables: 3
          other_n_syllables: 3
          self_ipu_duration: 0.10
          other_ipu_duration: 0.10
      test_predictors:
        - "residual_signed"
      standardize:
        - "residual_signed"
        - "latency"
        - "duration_s"
        - "time_within_run"
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"
