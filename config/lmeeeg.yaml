lmeeeg:
  enabled: false
  backend: "python"
  random_effects:
    group: "subject_id"
    structure: "random_intercept"

  models:
    convergence_subject_intercept:
      formula: "convergence ~ self_rate + other_rate + latency + duration_s + run"
      eligibility: "convergence"
      test_predictors:
        - "self_rate"
        - "other_rate"
      standardize:
        - self_rate
        - other_rate
        - latency
        - duration_s
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"
