lmeeeg:
  enabled: true
  backend: "lmeeeg"
  random_effects:
    group: "subject_id"
    structure: "random_intercept"

  models:
    convergence_subject_intercept:
      formula: "~ run + latency + duration_s"
      eligibility:
        not_null:
          - "latency"
      test_predictors:
        - "latency"
      standardize:
        - latency
        #- other_rate- latency
        - duration_s
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"
