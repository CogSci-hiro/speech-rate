# Phase 1 modular config duplicate from config/config.yaml
induced_trf:
  downsample_hz: 16.0
  bands: ["theta"]
  target_kinds: ["raw", "residual"]
  residual_bands: ["theta"]

  bands_hz:
    theta: [4.0, 7.0]

  models:
    - name: "unified"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "self_rate"
        - "other_rate"
        - "abs_diff"

  power:
    method: "hilbert"
    log_transform: "log10"   # options: none | log10 | ln
