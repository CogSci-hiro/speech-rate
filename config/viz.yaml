viz:
  formats: ["png", "pdf"]
  dpi: 300
  theme:
    name: "paper"
    colors:
      self: "#8C2D2D"
      other: "#1F4E79"
      shared: "#2F6B3B"
      neutral: "#4B5563"
      grid: "#D7DCE2"
      spine: "#9CA3AF"
      reference: "#6B7280"
      background: "#FFFFFF"
    rcparams:
      font.family: "serif"
      font.serif: ["STIX Two Text", "STIXGeneral", "DejaVu Serif"]
      mathtext.fontset: "stix"
      axes.titleweight: "semibold"
  qc:
    enabled: true
  figures:
    behavioural:
      speech_rate:
        enabled: true
        formats: ["png"]
        font_scale: 3.0
        min_trials_per_subject: 5
        histogram_bins: 30
        histogram_color: "#7B8794"
        point_size: 70
        dot_center_y: 0.0
        dot_spread_y: 0.10
        jitter_sd: 0.012
        connector_alpha: 0.75
        dot_alpha: 0.95
        random_seed: 42
        regression_line_color: "#1F4E79"
        show_marginalised_scatter: false
        marginalised_scatter_mode: "partial_residual"
        marginalised_scatter_color: "#1F4E79"
        marginalised_scatter_alpha: 0.35
        marginalised_scatter_size: 20
    variance_partition:
      use_proportions: false
      epsilon: 1.0e-12
      figure_width: 14
      figure_height: 6.0
      font_scale: 3.0
      venn_label_scale: 0.75
      venn_title_scale: 0.8
      legend_font_scale: 0.8
      legend_loc: "upper left"
      ylabel_font_scale: 0.45
      show_inset_labels: false
      constrained_w_pad: 0.02
      constrained_h_pad: 0.005
      wspace: 0.04
      hspace: 0.01
      anterior_inset_anchor: [0.80, 0.50, 0.18, 0.42]
      posterior_inset_anchor: [0.80, 0.50, 0.18, 0.42]
      rois:
        anterior:
          - "Fp1"
          - "Fp2"
          - "AF3"
          - "AF4"
          - "AF7"
          - "AF8"
          - "Fz"
          - "F1"
          - "F2"
          - "F3"
          - "F4"
          - "F5"
          - "F6"
          - "F7"
          - "F8"
          - "FCz"
          - "FC1"
          - "FC2"
          - "FC3"
          - "FC4"
          - "FC5"
          - "FC6"
        posterior:
          - "CPz"
          - "CP1"
          - "CP2"
          - "CP3"
          - "CP4"
          - "CP5"
          - "CP6"
          - "Pz"
          - "P1"
          - "P2"
          - "P3"
          - "P4"
          - "P5"
          - "P6"
          - "P7"
          - "P8"
          - "POz"
          - "PO3"
          - "PO4"
          - "PO7"
          - "PO8"
          - "Oz"
          - "O1"
          - "O2"
    lmeeeg_main_results:
      significance_threshold: 0.05
      plotting_tmin_s: -1.0
      plotting_tmax_s: 0.5
      robust_percentile: 99.5
      manual_vlim: 5
      figure_height: 10.5
      hspace: 0.20
      bottom_row_spacer_height: 0.45
      bottom_right_topomap_extra_offset: 0.0
      topomap_title_pad: 2
      bottom_topomap_title_y: -0.12
      topomap_cmap: "RdBu_r"
      colorbar_label: "Observed t value"
      font_scale: 3.0
      lower_panel_link_target_y: 0.88
      models:
        self:
          label: "Production"
          model_name: "self_rate_effect"
          effect_name: "self_rate"
          topomap_times_s: [-0.8, -0.4, 0.0]
        other:
          label: "Perception"
          model_name: "other_rate_effect"
          effect_name: "other_rate"
          topomap_times_s: [-0.7, -0.5]
    similarity_summary:
      enabled: true
      hide_topomaps: true
      n_topomaps: 4
      window_radius_ms: 50
      topomap_selection: "automatic"
      plotting_tmin_s: -2.0
      plotting_tmax_s: 0.5
      significance_threshold: 0.05
      topomap_cmap: "RdBu_r"
      colorbar_label: "Beta coefficient"
      predictor_a_label: "Production"
      predictor_b_label: "Perception"
      legend_anchor_x: 0.0
      legend_anchor_y: 0.92
      font_scale: 3.0
      null_envelope_percentiles: [2.5, 97.5]
    glm:
      contrasts: ["speech_rate"]
