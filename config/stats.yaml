# Stats-only config (loaded manually in workflow/Snakefile)
# Keeping this separate prevents inference/reporting tweaks from retriggering compute rules.
paths:
  out_dir: "/Volumes/work-4T/speech-rate-refactoring"

reporting:
  tables_format: "csv"  # csv | parquet

# Keep induced band metadata local to stats config so stats rule expansion does not
# depend on the tracked compute config.
induced_trf:
  bands: ["theta", "alpha"]
  target_kinds: ["residual"]
  # Optional: restrict residual induced analyses to this subset; [] disables residual analyses.
  residual_bands: ["theta", "alpha"]
  bands_hz:
    theta: [4.0, 8.0]
    alpha: [8.0, 12.0]
    beta: [13.0, 30.0]

stats:
  kernel_cluster:
    method: "tfce"   # tfce | threshold
    allow_placeholder_outputs: false  # debug-only; when true writes zero-filled fallback outputs on failure
    n_permutations: 100
    seed: 42
    threshold_p: 0.05  # Only used if method = threshold
    tfce:
      start: 0.0
      step: 0.01
    tail: 0
    adjacency:
      montage_name: "biosemi64"
