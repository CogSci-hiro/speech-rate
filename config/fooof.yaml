# Phase 1 modular config duplicate from config/config.yaml
fooof:
  n_jobs: 10

  # Pre-speech causal window aligned to self speech onset (t+1)
  prespeech_window_s:
    tmin: -2.0
    tmax: 0.0

  # ROI definitions
  rois:
    definition: "inline"
    values:
      ANTERIOR: ["Fz", "AFz", "FCz", "F1", "F2"]
      POSTERIOR: ["POz", "Pz", "Oz", "PO4", "PO7"]

  # Spectrum estimation
  spectrum:
    fmin_hz: 2.0
    fmax_hz: 30.0
    method: "welch"   # "welch" | "multitaper"
    welch_nperseg_s: 2.0
    welch_overlap: 0.5
    # Multitaper options (used only when method="multitaper")
    # multitaper_bandwidth_hz: 2.0
    multitaper_adaptive: false
    multitaper_low_bias: true

  # FOOOF model settings
  model:
    knee: false
    max_n_peaks: 6
    peak_width_limits_hz: [1.0, 12.0]
    min_peak_height: 0.0

  # Feature extraction
  features:
    aperiodic: ["offset", "exponent"]

    periodic_bands_hz:
      theta: [4.0, 7.0]
      alpha: [8.0, 12.0]
      beta:  [13.0, 30.0]

    periodic_measures:
      - "band_peak_height"

    include_center_frequency: false

  # QC rules
  qc:
    require_successful_fit: true
    store_fit_diagnostics: true

    peak_reliability:
      enabled: true
      min_detection_rate: 0.30

  # Standardization pipeline
  standardization:
    subject_level: true
    global_level: true

  # PCA compression
  pca:
    enabled: true
    retain:
      aperiodic: 1
      periodic: 1
    fit_scope: "full_dataset"
    export_loadings: true

  # Hierarchical LMM ladder
  lmm:
    outcome: "self_rate_tplus1"

    predictors:
      inertia: "self_rate_t"
      partner: "partner_rate_t"

    random_effects:
      intercept: true

    ladder:
      run: true
      steps: ["M0", "M1", "M2", "M3", "M4"]

    reporting:
      use_ml_for_lrt: true
      alpha: 0.05
