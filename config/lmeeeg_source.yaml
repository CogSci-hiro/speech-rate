lmeeeg_source:
  enabled: true
  backend: "lmeeeg"

  epochs:
    section: "margin_epochs"
    use_existing_margin_epochs: true

  random_effects:
    group: "subject_id"
    structure: "random_intercept"

  source_space:
    subjects_dir: "/Users/hiro/mne_data/MNE-fsaverage-data"
    fsaverage: "fsaverage"
    spacing: "ico2"  # Intentionally tiny for feasibility/QC only; not publication-ready source localization.
    surface: "white"
    add_dist: false
    subject_template: "fsaverage"  # Template-MRI feasibility mode: all runs use fsaverage rather than subject-specific anatomy.
    subject_map: {}

  forward:
    trans_pattern: "/Users/hiro/mne_data/MNE-fsaverage-data/fsaverage/bem/fsaverage-trans.fif"
    bem_solution_pattern: "/Users/hiro/mne_data/MNE-fsaverage-data/fsaverage/bem/fsaverage-5120-5120-5120-bem-sol.fif"
    mindist: 5.0
    eeg: true
    meg: false

  covariance:
    method: "empirical"
    tmin: null
    tmax: 0.0

  inverse:
    method: "MNE"
    loose: 0.2
    depth: 0.8
    snr: 3.0
    pick_ori: "normal"
    lambda2: null

  fitting:
    n_jobs: 1
    batch_size_vertices: 25
    verbose: true
    progress: true

  outputs:
    namespace: "lmeeeg_source"
    prepared_dirname: "prepared"
    group_dirname: "group"
    qc_subdir: "qc/lmeeeg_source"

  plotting:
    predictors:
      - "self_rate"
      - "other_rate"
    view: "lateral"
    hemi: "split"
    measure: "beta"
    time_summary: "mean"
    time_window: null
    time_step_ms: 100.0
    mask_by_significance: false
    significance_alpha: 0.05
    formats:
      - "png"
      - "pdf"
    colormap: "icefire"

  models:
    self_rate_effect:
      formula: "~ self_rate + latency + duration_s + time_within_run + run"
      eligibility:
        not_null:
          - "self_rate"
        min_values:
          self_n_syllables: 3
          self_ipu_duration: 0.10
      test_predictors:
        - "self_rate"
      standardize:
        - "self_rate"
        - "latency"
        - "duration_s"
        - "time_within_run"
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"

    other_rate_effect:
      formula: "~ other_rate + latency + duration_s + time_within_run + run"
      eligibility:
        not_null:
          - "other_rate"
        min_values:
          other_n_syllables: 3
          other_ipu_duration: 0.10
      test_predictors:
        - "other_rate"
      standardize:
        - "other_rate"
        - "latency"
        - "duration_s"
        - "time_within_run"
      random_effect_group: "subject_id"
      random_effect_structure: "random_intercept"
