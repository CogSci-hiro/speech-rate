glm:
  models:
    other_rate_model:
      formula: "~ other_rate + latency + run"
      eligibility:
        not_null:
          - self_rate
          - other_rate
          - self_n_syllables
          - other_n_syllables
          - self_ipu_duration
          - other_ipu_duration
        min_values:
          self_n_syllables: 3
          other_n_syllables: 3
          self_ipu_duration: 0.20
          other_ipu_duration: 0.20
        max_values:
          self_ipu_duration: 8.0
          other_ipu_duration: 8.0
      test_predictors:
        - "other_rate"
