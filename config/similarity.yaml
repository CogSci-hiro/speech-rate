similarity:
  enabled: true
  analysis_name: "other_vs_self"

  input:
    domain: "lmeeeg"
    result_kind: "group_stats"
    predictor_a: "other_rate"
    predictor_b: "self_rate"
    value_field: "beta"
    use_unthresholded: true

  metrics:
    whole_map:
      - "pearson"
    time_resolved_topography:
      enabled: true
      method: "pearson"

  inference:
    # Recompute pooled lmeEEG maps with the same estimator as the observed saved
    # betas.npy maps. In this repository that means rerunning the standard
    # lmeEEG approximation stage, not swapping in a different null-map estimator.
    method: "refit_permutation"
    n_permutations: 100
    tail: "two-sided"
    tfce:
      enabled: true
      e_power: 0.5
      h_power: 2.0
      dh: 0.1
    permutation_scheme:
      kind: "circular_shift_within_subject"
      group_by: ["subject_id"]
      within_run: true
      random_seed: 42

  outputs:
    save_null_distribution: true
    save_time_resolved_curve: true
    save_summary_table: true
    save_difference_map: true
