# Phase 1 modular config duplicate from config/config.yaml
evoked_trf:
  downsample_hz: 64.0
  emg:
    channels: ["EMG1", "EMG2"]
    channel_patterns: ["\\bEMG\\b", "\\bEXG\\b", "masseter", "jaw"]
    missing_policy: "zeros"   # options: error | zeros
    l_freq: 30.0
    h_freq: 150.0
    log_transform: true
    target_sfreq: 64.0
    zscore_within_run: true

  lags_s:
    tmin: -2.0
    tmax: 0.5

  cv:
    scheme: "leave_one_run_out"
    k_folds: 5
    blocked_by: "time_bins"
    time_bin_s: 60.0
  regularization:
    type: "ridge"  # options: ridge | laplacian
  ridge_alpha_grid:
    min: 2
    max: 6
    n_alpha: 10
  models:
    - name: "baseline"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
    - name: "self_rate"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "self_rate"
    - name: "other_rate"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "other_rate"
    - name: "abs_diff"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "abs_diff"
    - name: "self_rate_sq"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "self_rate"
        - "self_rate^2"
    - name: "other_rate_sq"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "other_rate"
        - "other_rate^2"
    - name: "abs_diff_sq"
      regressors:
        - "self_ipu_onset"
        - "other_ipu_offset"
        - "emg"
        - "abs_diff"
        - "abs_diff^2"
  n_jobs: 1
